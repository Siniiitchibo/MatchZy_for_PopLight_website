name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Run unit tests
        run: dotnet test tests/MatchZy.Tests -c Release

      - name: Get versions
        shell: bash
        run: |
          set -euo pipefail

          MATCHZY_VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' MatchZy.cs)
          CSSHARP_VERSION=$(grep -Po '<PackageReference Include="CounterStrikeSharp.API" Version="\K\d+(\.\d+)*' MatchZy.csproj)

          test -n "$MATCHZY_VERSION"
          test -n "$CSSHARP_VERSION"

          echo "MATCHZY_VERSION=$MATCHZY_VERSION" >> "$GITHUB_ENV"
          echo "CSSHARP_VERSION=$CSSHARP_VERSION" >> "$GITHUB_ENV"

          echo "MatchZy version: $MATCHZY_VERSION"
          echo "CounterStrikeSharp version: $CSSHARP_VERSION"

      - name: Build MatchZy
        run: |
          dotnet publish MatchZy.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/matchzy-publish"

      - name: Prepare standalone package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p standalone/addons/counterstrikesharp/plugins/MatchZy
          mkdir -p standalone/addons/counterstrikesharp/gamedata

          cp -a "$RUNNER_TEMP/matchzy-publish/." \
            standalone/addons/counterstrikesharp/plugins/MatchZy/

          cp gamedata/matchzy.json \
            standalone/addons/counterstrikesharp/gamedata/

          cp -a cfg standalone/

          # These files are created by MatchZy when missing.
          # Do not include them in updates.
          rm -f \
            standalone/cfg/MatchZy/admins.json \
            standalone/cfg/MatchZy/database.json \
            standalone/cfg/MatchZy/savednades.json \
            standalone/cfg/MatchZy/whitelist.cfg

          (
            cd standalone
            zip -q -r "../MatchZy-${MATCHZY_VERSION}.zip" .
          )

      - name: Download CounterStrikeSharp
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          for platform in linux windows; do
            echo "Downloading CounterStrikeSharp $CSSHARP_VERSION for $platform"

            curl --fail --location \
              --retry 3 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --output "downloads/cssharp-${platform}.zip" \
              "https://github.com/roflmuffin/CounterStrikeSharp/releases/download/v${CSSHARP_VERSION}/counterstrikesharp-with-runtime-${platform}-${CSSHARP_VERSION}.zip"

            # Verify the downloaded archive before packaging it.
            unzip -tq "downloads/cssharp-${platform}.zip"
          done

      - name: Prepare packages with CounterStrikeSharp
        shell: bash
        run: |
          set -euo pipefail

          for platform in linux windows; do
            package_dir="package-${platform}"
            mkdir -p "$package_dir"

            unzip -q "downloads/cssharp-${platform}.zip" \
              -d "$package_dir"

            # Copy our plugin, gamedata and configuration over the CSS package.
            cp -a standalone/. "$package_dir/"

            (
              cd "$package_dir"
              zip -q -r \
                "../MatchZy-${MATCHZY_VERSION}-with-cssharp-${platform}.zip" .
            )
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: MatchZy ${{ env.MATCHZY_VERSION }}
          tag_name: ${{ env.MATCHZY_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Custom MatchZy build for the PopLight website.

            Installation:
            - MatchZy-${{ env.MATCHZY_VERSION }}.zip: plugin only. Requires Metamod and CounterStrikeSharp.
            - MatchZy-${{ env.MATCHZY_VERSION }}-with-cssharp-linux.zip: plugin with CounterStrikeSharp and runtime for Linux.
            - MatchZy-${{ env.MATCHZY_VERSION }}-with-cssharp-windows.zip: plugin with CounterStrikeSharp and runtime for Windows.

            Extract the selected package into the server's game/csgo directory.
            Metamod must already be installed.

            Existing admins.json, database.json, savednades.json and whitelist.cfg are preserved.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            MatchZy-${{ env.MATCHZY_VERSION }}.zip
            MatchZy-${{ env.MATCHZY_VERSION }}-with-cssharp-linux.zip
            MatchZy-${{ env.MATCHZY_VERSION }}-with-cssharp-windows.zip